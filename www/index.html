<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小白菜谱助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-left: calc(20px + env(safe-area-inset-left));
      padding-right: calc(20px + env(safe-area-inset-right));
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 24px; color: #333; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 15px; color: #666; }
    .tab.active { border-color: #4CAF50; color: #4CAF50; font-weight: bold; }
    .input-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #666; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: #4CAF50; }
    .hint { font-size: 12px; color: #999; margin-top: 4px; }
    .servings-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .servings-label { color: #666; font-size: 14px; white-space: nowrap; }
    .servings-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; color: #666; }
    .servings-btn.active { border-color: #4CAF50; color: #4CAF50; background: #e8f5e9; }
    .category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .category-label { color: #666; font-size: 14px; white-space: nowrap; }
    .category-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; color: #666; }
    .category-btn.active { border-color: #4CAF50; color: #4CAF50; background: #e8f5e9; }
    .btn-cart { padding: 6px 14px; background: #fff; color: #1976d2; border: 1px solid #1976d2; border-radius: 6px; font-size: 13px; cursor: pointer; margin-left: 8px; }
    .btn-cart:hover { background: #e3f2fd; }
    .btn-cart.added { background: #e3f2fd; color: #999; border-color: #ddd; cursor: default; }
    .shopping-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .shopping-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .shopping-header h2 { font-size: 18px; color: #333; }
    .btn-clear-cart { padding: 6px 14px; background: #fff; color: #e53935; border: 1px solid #e53935; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-clear-cart:hover { background: #ffebee; }
    .shopping-list { list-style: none; padding: 0; }
    .shopping-list li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #444; display: flex; justify-content: space-between; }
    .shopping-list li:last-child { border-bottom: none; }
    .shopping-item-name { flex: 1; }
    .shopping-item-amount { color: #666; margin-left: 12px; }
    .shopping-empty { text-align: center; padding: 40px; color: #999; }
    .cart-badge { background: #e53935; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; margin-left: 4px; }
    .common-section { margin-bottom: 12px; }
    .common-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .common-header label { margin-bottom: 0; }
    .common-toggle { font-size: 12px; color: #4CAF50; cursor: pointer; border: none; background: none; }
    .common-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: #e8f5e9; color: #2e7d32; border-radius: 14px; font-size: 13px; cursor: pointer; border: 1px solid #c8e6c9; }
    .tag:hover { background: #c8e6c9; }
    .tag-remove { font-size: 11px; color: #999; cursor: pointer; margin-left: 2px; }
    .tag-remove:hover { color: #e53935; }
    .add-tag-row { display: flex; gap: 6px; }
    .add-tag-row input { flex: 1; padding: 6px 10px; font-size: 13px; }
    .add-tag-row button { padding: 6px 12px; font-size: 13px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .btn-secondary { width: 100%; padding: 10px; background: #fff; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-secondary:hover { background: #e8f5e9; }
    .btn-secondary:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; }
    .btn-primary { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #45a049; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-save { padding: 6px 14px; background: #fff; color: #4CAF50; border: 1px solid #4CAF50; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-save:hover { background: #e8f5e9; }
    .btn-save.saved { background: #e8f5e9; color: #999; border-color: #ddd; cursor: default; }
    .btn-delete { padding: 6px 14px; background: #fff; color: #e53935; border: 1px solid #e53935; border-radius: 6px; font-size: 13px; cursor: pointer; margin-left: 8px; }
    .btn-delete:hover { background: #ffebee; }
    .btn-pin { padding: 6px 14px; background: #fff; color: #f9a825; border: 1px solid #f9a825; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-pin:hover { background: #fffde7; }
    .btn-pin.pinned { background: #fffde7; color: #f57f17; border-color: #f57f17; }
    .recipe-card.pinned-card { border-left: 3px solid #f9a825; }
    .btn-retry { width: 100%; padding: 10px; background: #fff; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn-retry:hover { background: #e8f5e9; }
    .btn-retry:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-bar input { flex: 1; }
    .search-bar select { width: 120px; }
    .results { display: flex; flex-direction: column; gap: 16px; }
    .recipe-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .recipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .recipe-name { font-size: 18px; font-weight: bold; color: #333; }
    .recipe-category { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .recipe-cost { color: #f57c00; font-size: 14px; margin-bottom: 8px; }
    .recipe-time { color: #1976d2; font-size: 14px; margin-bottom: 8px; }
    .recipe-ingredients { color: #666; font-size: 14px; margin-bottom: 8px; }
    .recipe-steps { list-style: none; padding: 0; }
    .recipe-steps li { padding: 4px 0; font-size: 14px; color: #444; border-bottom: 1px dashed #eee; }
    .recipe-steps li:last-child { border-bottom: none; }
    .recipe-steps li::before { content: "→ "; color: #4CAF50; }
    .recipe-tip { margin-top: 8px; padding: 8px; background: #fff8e1; border-radius: 6px; font-size: 13px; color: #795548; }
    .loading { text-align: center; padding: 40px; color: #999; }
    .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; text-align: center; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .hidden { display: none; }

    /* Settings Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #fff; border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .modal-content h2 { margin-bottom: 12px; color: #333; font-size: 20px; }
    .modal-desc { color: #666; font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
    .modal-desc a { color: #4CAF50; text-decoration: none; }
    .modal-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .modal-input:focus { outline: none; border-color: #4CAF50; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-primary { background: #4CAF50; color: #fff; border: none; }
    .btn-primary:hover { background: #45a049; }
    .btn-secondary { background: #fff; color: #666; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #f5f5f5; }

    /* Touch target improvements */
    button, .tab, .tag, .category-btn, .servings-btn {
      min-height: 44px;
    }
    .tag-remove {
      min-width: 24px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(76, 175, 80, 0.3);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { max-width: 100%; }
      .recipe-header { flex-wrap: wrap; gap: 8px; }
      .search-bar { flex-direction: column; }
      .search-bar select { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h1 style="margin:0;">小白菜谱助手</h1>
      <button onclick="showSettingsModal()" style="padding:8px 16px;background:#fff;color:#4CAF50;border:1px solid #4CAF50;border-radius:6px;font-size:13px;cursor:pointer;">设置</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('generate')">生成菜谱</div>
      <div class="tab" onclick="switchTab('saved')">我的菜谱</div>
      <div class="tab" onclick="switchTab('shopping')">购物清单<span class="cart-badge" id="cartBadge">0</span></div>
    </div>

    <div id="generateSection">
      <div class="input-section">
        <div class="input-group">
          <label>食材（必填）</label>
          <input type="text" id="ingredients" placeholder="输入食材，用逗号分隔，如：鸡胸肉, 西兰花">
          <div class="hint">输入1-2个食材，支持消耗剩余食材</div>
        </div>
        <div class="common-section">
          <div class="common-header">
            <label>常用食材</label>
            <button class="common-toggle" id="manageToggle" onclick="toggleManage()">管理</button>
          </div>
          <div class="common-tags" id="commonTags"></div>
          <div class="add-tag-row hidden" id="manageRow">
            <input type="text" id="newIngredient" placeholder="输入食材名称" onkeydown="if(event.key==='Enter')addCommonIngredient()">
            <button onclick="addCommonIngredient()">添加</button>
          </div>
        </div>
        <div class="input-group">
          <label>预算上限（可选）</label>
          <input type="number" id="budget" placeholder="如：30">
          <div class="hint">填写后推荐菜谱会控制在预算内</div>
        </div>
        <div class="servings-row">
          <span class="servings-label">用餐人数：</span>
          <button class="servings-btn" onclick="setServings(1, this)">1人</button>
          <button class="servings-btn active" onclick="setServings(2, this)">2人</button>
          <button class="servings-btn" onclick="setServings(3, this)">3人</button>
          <button class="servings-btn" onclick="setServings(4, this)">4人</button>
        </div>
        <div class="category-row">
          <span class="category-label">菜谱类型：</span>
          <button class="category-btn active" onclick="setCategory('全部', this)">全部</button>
          <button class="category-btn" onclick="setCategory('炒', this)">炒</button>
          <button class="category-btn" onclick="setCategory('凉拌', this)">凉拌</button>
          <button class="category-btn" onclick="setCategory('汤', this)">汤</button>
          <button class="category-btn" onclick="setCategory('焖煮', this)">焖煮</button>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="getRecipes()">生成菜谱</button>
        <button class="btn-secondary" onclick="useCommonIngredients()">用常用食材生成</button>
      </div>
      <div id="results" class="results"></div>
    </div>

    <div id="savedSection" class="hidden">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索菜名或食材..." oninput="loadSaved()">
        <select id="categoryFilter" onchange="loadSaved()">
          <option value="">全部分类</option>
          <option value="凉拌">凉拌</option>
          <option value="汤">汤</option>
          <option value="炒">炒</option>
          <option value="焖煮">焖煮</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div id="savedResults" class="results"></div>
    </div>

    <div id="shoppingSection" class="hidden">
      <div class="shopping-section">
        <div class="shopping-header">
          <h2>购物清单</h2>
          <button class="btn-clear-cart" onclick="clearCart()">清空清单</button>
        </div>
        <ul class="shopping-list" id="shoppingList"></ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { getRecipes as fetchRecipes } from './js/api.js';
    import { initDatabase, saveRecipe as dbSaveRecipe, getSavedRecipes, deleteRecipe as dbDeleteRecipe, togglePinRecipe, getCommonIngredients, addCommonIngredient as dbAddIngredient, deleteCommonIngredient as dbDeleteIngredient } from './js/db.js';
    import { initSettings, showSettingsModal } from './js/settings.js';

    const seenRecipes = new Set();
    let currentServings = 2;
    let commonIngredients = [];

    // Initialize app
    (async () => {
      await initDatabase();
      await initSettings();
      await loadCommonIngredients();
      updateCartBadge();
    })();

    function setServings(n, btn) {
      currentServings = n;
      document.querySelectorAll('.servings-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    let currentCategory = '全部';

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function loadCommonIngredients() {
      commonIngredients = await getCommonIngredients();
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('commonTags');
      if (commonIngredients.length === 0) {
        container.innerHTML = '<span style="font-size:12px;color:#999;">点击"管理"添加常用食材</span>';
        return;
      }
      container.innerHTML = commonIngredients.map(name =>
        `<span class="tag" onclick="addToInput('${name}')">${name}<span class="tag-remove" onclick="event.stopPropagation();removeCommonIngredient('${name}')">×</span></span>`
      ).join('');
    }

    function addToInput(name) {
      const input = document.getElementById('ingredients');
      const current = input.value.trim();
      if (current.split(/[,，、\s]+/).filter(Boolean).includes(name)) return;
      input.value = current ? current + '、' + name : name;
    }

    function toggleManage() {
      const row = document.getElementById('manageRow');
      const btn = document.getElementById('manageToggle');
      row.classList.toggle('hidden');
      btn.textContent = row.classList.contains('hidden') ? '管理' : '完成';
    }

    async function addCommonIngredient() {
      const input = document.getElementById('newIngredient');
      const name = input.value.trim();
      if (!name) return;
      const result = await dbAddIngredient(name);
      if (result.added) {
        commonIngredients = await getCommonIngredients();
        renderTags();
      }
      input.value = '';
    }

    async function removeCommonIngredient(name) {
      await dbDeleteIngredient(name);
      commonIngredients = await getCommonIngredients();
      renderTags();
    }

    function useCommonIngredients() {
      if (commonIngredients.length === 0) {
        document.getElementById('results').innerHTML = '<div class="empty">请先添加常用食材</div>';
        return;
      }
      const shuffled = [...commonIngredients].sort(() => Math.random() - 0.5);
      const count = Math.min(shuffled.length, Math.random() > 0.5 ? 2 : 1);
      const picked = shuffled.slice(0, count);
      document.getElementById('ingredients').value = picked.join('、');
      getRecipes();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('generateSection').classList.add('hidden');
      document.getElementById('savedSection').classList.add('hidden');
      document.getElementById('shoppingSection').classList.add('hidden');

      if (tab === 'generate') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('generateSection').classList.remove('hidden');
      } else if (tab === 'saved') {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('savedSection').classList.remove('hidden');
        loadSaved();
      } else if (tab === 'shopping') {
        document.querySelectorAll('.tab')[2].classList.add('active');
        document.getElementById('shoppingSection').classList.remove('hidden');
        renderCart();
      }
    }

    async function getRecipes(isRetry = false) {
      const ingredientsInput = document.getElementById('ingredients').value.trim();
      const budgetInput = document.getElementById('budget').value.trim();
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('submitBtn');

      if (!ingredientsInput) {
        resultsDiv.innerHTML = '<div class="error">请输入至少一个食材</div>';
        return;
      }

      if (!isRetry) {
        seenRecipes.clear();
      }

      const ingredients = ingredientsInput.split(/[,，、\s]+/).filter(Boolean);
      const budget = budgetInput ? parseInt(budgetInput) : null;
      const exclude = [...seenRecipes];

      btn.disabled = true;
      btn.textContent = '生成中...';
      resultsDiv.innerHTML = '<div class="loading"><span class="spinner"></span>正在为你生成菜谱...</div>';

      try {
        const recipes = await fetchRecipes(ingredients, budget, exclude, currentServings, currentCategory);

        const newRecipes = recipes.filter(r => !seenRecipes.has(r.name));

        if (newRecipes.length === 0) {
          resultsDiv.innerHTML = '<div class="empty">已经没有更多菜谱了，换个食材试试吧</div>';
          return;
        }

        newRecipes.forEach(r => seenRecipes.add(r.name));

        resultsDiv.innerHTML = newRecipes.map((r, i) => `
          <div class="recipe-card">
            <div class="recipe-header">
              <span class="recipe-name">${r.name}</span>
              <span class="recipe-category">${r.category}</span>
            </div>
            <div class="recipe-cost">预估成本：约 ${r.estimatedCost} 元</div>
            ${r.cookingTime ? `<div class="recipe-time">烹饪时间：约 ${r.cookingTime} 分钟</div>` : ''}
            <div class="recipe-ingredients">食材：${r.ingredients.join('、')}</div>
            <ol class="recipe-steps">
              ${r.steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
            ${r.tip ? `<div class="recipe-tip">💡 ${r.tip}</div>` : ''}
            <button class="btn-save" id="saveBtn${i}" onclick="saveRecipe(${i})">收藏</button>
            <button class="btn-cart" id="cartBtn${i}" onclick="addToCart(${i})">加入购物清单</button>
          </div>
        `).join('') + '<button class="btn-retry" onclick="getRecipes(true)">换一批</button>';

        window._currentRecipes = newRecipes;
      } catch (err) {
        resultsDiv.innerHTML = `<div class="error">${err.message || '网络错误，请重试'}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '生成菜谱';
      }
    }

    async function saveRecipe(index) {
      const recipe = window._currentRecipes[index];
      const btn = document.getElementById(`saveBtn${index}`);

      const result = await dbSaveRecipe(recipe);
      btn.textContent = result.saved ? '已收藏' : result.message;
      btn.classList.add('saved');
      btn.disabled = true;
    }

    async function deleteRecipe(encodedName, category) {
      if (!confirm('确定要删除这个菜谱吗？')) return;
      const name = decodeURIComponent(encodedName);
      await dbDeleteRecipe(name, category);
      loadSaved();
    }

    async function togglePin(encodedName, category, btn) {
      const name = decodeURIComponent(encodedName);
      await togglePinRecipe(name, category);
      loadSaved();
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('shoppingCart') || '[]');
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('shoppingCart', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCart();
      const badge = document.getElementById('cartBadge');
      badge.textContent = cart.length;
      badge.style.display = cart.length > 0 ? 'inline' : 'none';
    }

    function addToCart(index) {
      const recipe = window._currentRecipes[index];
      const cart = getCart();

      if (cart.find(r => r.name === recipe.name)) {
        const btn = document.getElementById(`cartBtn${index}`);
        btn.textContent = '已在清单中';
        btn.classList.add('added');
        btn.disabled = true;
        return;
      }

      cart.push({
        name: recipe.name,
        category: recipe.category,
        ingredients: recipe.ingredients,
        servings: currentServings,
      });

      saveCart(cart);

      const btn = document.getElementById(`cartBtn${index}`);
      btn.textContent = '已在清单中';
      btn.classList.add('added');
      btn.disabled = true;
    }

    function removeFromCart(name) {
      const cart = getCart().filter(r => r.name !== name);
      saveCart(cart);
      renderCart();
    }

    function clearCart() {
      if (!confirm('确定要清空购物清单吗？')) return;
      saveCart([]);
      renderCart();
    }

    function renderCart() {
      const cart = getCart();
      const listEl = document.getElementById('shoppingList');

      if (cart.length === 0) {
        listEl.innerHTML = '<li class="shopping-empty">购物清单是空的，去生成菜谱并添加吧</li>';
        return;
      }

      // Aggregate ingredients
      const ingredientMap = {};
      for (const recipe of cart) {
        for (const ing of recipe.ingredients) {
          // Parse ingredient: "食材 用量" or just "食材"
          const match = ing.match(/^(.+?)(?:\s*(\d+.+))?$/);
          if (match) {
            const name = match[1].trim();
            const amount = match[2] || '';
            if (!ingredientMap[name]) {
              ingredientMap[name] = [];
            }
            if (amount) {
              ingredientMap[name].push(amount);
            }
          }
        }
      }

      listEl.innerHTML = cart.map(r => `
        <li>
          <span class="shopping-item-name">${r.name} <span style="color:#999;font-size:12px;">(${r.category})</span></span>
          <button class="btn-delete" onclick="removeFromCart('${r.name}')" style="margin-left:8px;">移除</button>
        </li>
      `).join('') + '<li style="margin-top:16px;padding-top:16px;border-top:2px solid #eee;"><strong>食材汇总：</strong></li>' +
        Object.entries(ingredientMap).map(([name, amounts]) => `
          <li>
            <span class="shopping-item-name">${name}</span>
            <span class="shopping-item-amount">${amounts.length > 0 ? amounts.join(' + ') : '适量'}</span>
          </li>
        `).join('');
    }

    // Initialize cart badge on load
    updateCartBadge();

    async function loadSaved() {
      const search = document.getElementById('searchInput').value.trim();
      const category = document.getElementById('categoryFilter').value;
      const resultsDiv = document.getElementById('savedResults');

      const recipes = await getSavedRecipes(search, category);

      if (recipes.length === 0) {
        resultsDiv.innerHTML = '<div class="empty">还没有收藏的菜谱，去生成一个吧</div>';
        return;
      }

      resultsDiv.innerHTML = recipes.map((r, i) => `
        <div class="recipe-card${r.pinned ? ' pinned-card' : ''}">
          <div class="recipe-header">
            <span class="recipe-name">${r.pinned ? '&#11088; ' : ''}${r.name}</span>
            <span class="recipe-category">${r.category}</span>
          </div>
          ${r.estimatedCost ? `<div class="recipe-cost">预估成本：约 ${r.estimatedCost} 元</div>` : ''}
          ${r.cookingTime ? `<div class="recipe-time">烹饪时间：约 ${r.cookingTime} 分钟</div>` : ''}
          ${r.ingredients ? `<div class="recipe-ingredients">食材：${r.ingredients.join('、')}</div>` : ''}
          ${r.steps ? `<ol class="recipe-steps">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}
          ${r.tip ? `<div class="recipe-tip">💡 ${r.tip}</div>` : ''}
          <button class="btn-pin${r.pinned ? ' pinned' : ''}" onclick="togglePin('${encodeURIComponent(r.name)}', '${r.category}', this)">${r.pinned ? '已置顶' : '置顶'}</button>
          <button class="btn-delete" onclick="deleteRecipe('${encodeURIComponent(r.name)}', '${r.category}')">删除</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
