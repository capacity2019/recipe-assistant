<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小白菜谱助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-left: calc(20px + env(safe-area-inset-left));
      padding-right: calc(20px + env(safe-area-inset-right));
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 24px; color: #333; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 15px; color: #666; }
    .tab.active { border-color: #4CAF50; color: #4CAF50; font-weight: bold; }
    .input-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #666; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: #4CAF50; }
    .hint { font-size: 12px; color: #999; margin-top: 4px; }
    .servings-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .servings-label { color: #666; font-size: 14px; white-space: nowrap; }
    .servings-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; color: #666; }
    .servings-btn.active { border-color: #4CAF50; color: #4CAF50; background: #e8f5e9; }
    .category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .category-label { color: #666; font-size: 14px; white-space: nowrap; }
    .category-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; color: #666; }
    .category-btn.active { border-color: #4CAF50; color: #4CAF50; background: #e8f5e9; }
    .btn-cart { padding: 6px 14px; background: #fff; color: #1976d2; border: 1px solid #1976d2; border-radius: 6px; font-size: 13px; cursor: pointer; margin-left: 8px; }
    .btn-cart:hover { background: #e3f2fd; }
    .btn-cart.added { background: #e3f2fd; color: #999; border-color: #ddd; cursor: default; }
    .shopping-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .shopping-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .shopping-header h2 { font-size: 18px; color: #333; }
    .btn-clear-cart { padding: 6px 14px; background: #fff; color: #e53935; border: 1px solid #e53935; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-clear-cart:hover { background: #ffebee; }
    .shopping-list { list-style: none; padding: 0; }
    .shopping-list li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #444; display: flex; justify-content: space-between; }
    .shopping-list li:last-child { border-bottom: none; }
    .shopping-item-name { flex: 1; }
    .shopping-item-amount { color: #666; margin-left: 12px; }
    .shopping-empty { text-align: center; padding: 40px; color: #999; }
    .cart-badge { background: #e53935; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; margin-left: 4px; }
    .common-section { margin-bottom: 12px; }
    .common-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .common-header label { margin-bottom: 0; }
    .common-toggle { font-size: 12px; color: #4CAF50; cursor: pointer; border: none; background: none; }
    .common-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: #e8f5e9; color: #2e7d32; border-radius: 14px; font-size: 13px; cursor: pointer; border: 1px solid #c8e6c9; }
    .tag:hover { background: #c8e6c9; }
    .tag-remove { font-size: 11px; color: #999; cursor: pointer; margin-left: 2px; }
    .tag-remove:hover { color: #e53935; }
    .add-tag-row { display: flex; gap: 6px; }
    .add-tag-row input { flex: 1; padding: 6px 10px; font-size: 13px; }
    .add-tag-row button { padding: 6px 12px; font-size: 13px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .btn-secondary { width: 100%; padding: 10px; background: #fff; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-secondary:hover { background: #e8f5e9; }
    .btn-secondary:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; }
    .btn-primary { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #45a049; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-save { padding: 6px 14px; background: #fff; color: #4CAF50; border: 1px solid #4CAF50; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-save:hover { background: #e8f5e9; }
    .btn-save.saved { background: #e8f5e9; color: #999; border-color: #ddd; cursor: default; }
    .btn-delete { padding: 6px 14px; background: #fff; color: #e53935; border: 1px solid #e53935; border-radius: 6px; font-size: 13px; cursor: pointer; margin-left: 8px; }
    .btn-delete:hover { background: #ffebee; }
    .btn-pin { padding: 6px 14px; background: #fff; color: #f9a825; border: 1px solid #f9a825; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-pin:hover { background: #fffde7; }
    .btn-pin.pinned { background: #fffde7; color: #f57f17; border-color: #f57f17; }
    .recipe-card.pinned-card { border-left: 3px solid #f9a825; }
    .btn-retry { width: 100%; padding: 10px; background: #fff; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn-retry:hover { background: #e8f5e9; }
    .btn-retry:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-bar input { flex: 1; }
    .search-bar select { width: 120px; }
    .results { display: flex; flex-direction: column; gap: 16px; }
    .recipe-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .recipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .recipe-name { font-size: 18px; font-weight: bold; color: #333; }
    .recipe-category { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .recipe-cost { color: #f57c00; font-size: 14px; margin-bottom: 8px; }
    .recipe-time { color: #1976d2; font-size: 14px; margin-bottom: 8px; }
    .recipe-ingredients { color: #666; font-size: 14px; margin-bottom: 8px; }
    .recipe-steps { list-style: none; padding: 0; }
    .recipe-steps li { padding: 4px 0; font-size: 14px; color: #444; border-bottom: 1px dashed #eee; }
    .recipe-steps li:last-child { border-bottom: none; }
    .recipe-steps li::before { content: "→ "; color: #4CAF50; }
    .recipe-tip { margin-top: 8px; padding: 8px; background: #fff8e1; border-radius: 6px; font-size: 13px; color: #795548; }
    .loading { text-align: center; padding: 40px; color: #999; }
    .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; text-align: center; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .hidden { display: none; }

    /* Touch target improvements */
    button, .tab, .tag, .category-btn, .servings-btn {
      min-height: 44px;
    }
    .tag-remove {
      min-width: 24px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(76, 175, 80, 0.3);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { max-width: 100%; }
      .recipe-header { flex-wrap: wrap; gap: 8px; }
      .search-bar { flex-direction: column; }
      .search-bar select { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h1 style="margin:0;">小白菜谱助手</h1>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('generate')">生成菜谱</div>
      <div class="tab" onclick="switchTab('saved')">我的菜谱</div>
      <div class="tab" onclick="switchTab('shopping')">购物清单<span class="cart-badge" id="cartBadge">0</span></div>
    </div>

    <div id="generateSection">
      <div class="input-section">
        <div class="input-group">
          <label>食材（必填）</label>
          <input type="text" id="ingredients" placeholder="输入食材，用逗号分隔，如：鸡胸肉, 西兰花">
          <div class="hint">输入1-2个食材，支持消耗剩余食材</div>
        </div>
        <div class="common-section">
          <div class="common-header">
            <label>常用食材</label>
            <button class="common-toggle" id="manageToggle" onclick="toggleManage()">管理</button>
          </div>
          <div class="common-tags" id="commonTags"></div>
          <div class="add-tag-row hidden" id="manageRow">
            <input type="text" id="newIngredient" placeholder="输入食材名称" onkeydown="if(event.key==='Enter')addCommonIngredient()">
            <button onclick="addCommonIngredient()">添加</button>
          </div>
        </div>
        <div class="input-group">
          <label>预算上限（可选）</label>
          <input type="number" id="budget" placeholder="如：30">
          <div class="hint">填写后推荐菜谱会控制在预算内</div>
        </div>
        <div class="servings-row">
          <span class="servings-label">用餐人数：</span>
          <button class="servings-btn" onclick="setServings(1, this)">1人</button>
          <button class="servings-btn active" onclick="setServings(2, this)">2人</button>
          <button class="servings-btn" onclick="setServings(3, this)">3人</button>
          <button class="servings-btn" onclick="setServings(4, this)">4人</button>
        </div>
        <div class="category-row">
          <span class="category-label">菜谱类型：</span>
          <button class="category-btn active" onclick="setCategory('全部', this)">全部</button>
          <button class="category-btn" onclick="setCategory('炒', this)">炒</button>
          <button class="category-btn" onclick="setCategory('凉拌', this)">凉拌</button>
          <button class="category-btn" onclick="setCategory('汤', this)">汤</button>
          <button class="category-btn" onclick="setCategory('焖煮', this)">焖煮</button>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="getRecipes()">生成菜谱</button>
        <button class="btn-secondary" onclick="useCommonIngredients()">用常用食材生成</button>
      </div>
      <div id="results" class="results"></div>
    </div>

    <div id="savedSection" class="hidden">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索菜名或食材..." oninput="loadSaved()">
        <select id="categoryFilter" onchange="loadSaved()">
          <option value="">全部分类</option>
          <option value="凉拌">凉拌</option>
          <option value="汤">汤</option>
          <option value="炒">炒</option>
          <option value="焖煮">焖煮</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div id="savedResults" class="results"></div>
    </div>

    <div id="shoppingSection" class="hidden">
      <div class="shopping-section">
        <div class="shopping-header">
          <h2>购物清单</h2>
          <button class="btn-clear-cart" onclick="clearCart()">清空清单</button>
        </div>
        <ul class="shopping-list" id="shoppingList"></ul>
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
